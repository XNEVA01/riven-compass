# 每天北京时间 03:20 抓一次 warframe.market 全量挂单，聚合并发布快照。
# GitHub schedule 按 UTC 跑（19:20 UTC = 次日 03:20 北京时间），实际触发常有几分钟级延迟。
# 出口被 Cloudflare 挑战时自动用 playwright 取 Cookie 断点续扫（pipeline/scan_ci.sh）。
# 发布方式：孤儿分支 market-data 只放 market.json（每日强推覆盖，仓库不膨胀），
# 同时打轻量 tag snap-YYYY-MM-DD；服务器定时从 jsDelivr 按 tag 拉取（tag 缓存不可变）。
# 备选方案：仓库里有 deploy_ci.sh（SSH 直发，需要 DEPLOY_SSH_KEY secret），想切换随时恢复。
on:
  schedule:
    - cron: "20 19 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/snapshot.yml"]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        run: bash pipeline/scan_ci.sh

      - name: Aggregate
        run: |
          cd pipeline
          mkdir -p out
          python3 -u wm_pipeline.py aggregate --config config.ci.json --date "$DAY" --out out/market.json

      - name: Validate
        run: |
          python3 - <<'PY'
          import json, os
          day = os.environ["DAY"]
          d = json.load(open("pipeline/out/market.json"))
          weapons = len(d["weapons"])
          assert d["meta"]["scan_date"] == day, f"scan_date {d['meta']['scan_date']} != {day}"
          assert weapons >= 300, f"only {weapons} weapons"
          print(f"validated: {weapons} weapons, generated_at {d['meta']['generated_at']}")
          PY

      - name: Publish to repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="snap-$DAY"
          TMPD=$(mktemp -d)
          cd "$TMPD"
          git init -q .
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/pipeline/out/market.json" market.json
          SUMMARY=$(python3 -c "import json;d=json.load(open('market.json'));print(len(d['weapons']),'weapons,',d['meta']['generated_at'])")
          git add market.json
          git commit -qm "snapshot $DAY: $SUMMARY"
          git branch -M market-data
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/XNEVA01/riven-compass.git"
          git push -f origin market-data
          git tag "$TAG"
          git push origin "$TAG"
          echo "published $TAG ($SUMMARY)"
          # 清理 10 天前的旧 tag，免得仓库 refs 无限增长
          CUTOFF=$(date -d "10 days ago" +%F)
          for t in $(git ls-remote --tags origin 'snap-*' | awk -F/ '{print $NF}' | sort -u); do
            d=${t#snap-}
            if [[ "$d" < "$CUTOFF" ]]; then
              git push origin --delete "$t" && echo "pruned old tag $t"
            fi
          done

      - name: Upload debug info on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-debug-${{ env.DAY }}
          path: |
            pipeline/scan-*.log
            pipeline/raw/_scan_meta.json
          retention-days: 3
